<script>/* embed mode (map.html?embed): the US map alone, inside the artifact's "The US" chapter; the site's navbar and the zoom levels are hidden, and scrolling never leaves the US */
if (/[?&]embed\b/.test(location.search)) { document.documentElement.classList.add("embed");
  addEventListener("wheel", e => { const dy = e.deltaY; if (typeof smSel === "undefined") return e.stopImmediatePropagation();
    if (smSel >= 0 || dy < 0 || USK > 1 + 1e-3) return;   /* in a state, zooming in, or zooming back out to 1x: the map's own zoom */
    e.preventDefault(); e.stopImmediatePropagation(); }, {passive: false, capture: true});
  addEventListener("keydown", e => { if (["-", "+", "=", "PageUp", "PageDown"].includes(e.key)) e.stopImmediatePropagation(); }, true); }
</script>
